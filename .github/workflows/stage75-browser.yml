name: Stage 7.5 browser regression
on:
  workflow_dispatch:
  push:
    branches: [land-engine-stage2]
    paths:
      - '.github/workflows/stage75-browser.yml'
      - 'tests/stage75-browser.spec.cjs'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start local test server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/michi-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Browser regression
        run: npx playwright test tests/stage75-browser.spec.cjs --workers=1 --timeout=120000 --reporter=list,html --trace=retain-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage75-browser-report
          path: |
            playwright-report/
            test-results/
