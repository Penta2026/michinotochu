name: Ver10 trip card template gate
on:
  workflow_dispatch:
  push:
    branches: [trip-card-template-v10]
    paths:
      - 'trip-card-template.webp'
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UPGRADE_WEBROOT: /tmp/michi-upgrade
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: test -s trip-card-template.webp
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Stage v9 and start same-origin server
        run: |
          mkdir -p "$UPGRADE_WEBROOT"
          git archive 82926e62a090fd28d97a58e5ce6b5a173373d88a | tar -x -C "$UPGRADE_WEBROOT"
          python3 -m http.server 8766 --bind 127.0.0.1 --directory "$UPGRADE_WEBROOT" >/tmp/michi-upgrade.log 2>&1 &
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/michi-current.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8766/ >/dev/null && curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: npx playwright test tests/stage75-browser.spec.cjs tests/stage81-destination.spec.cjs tests/stage82-ride.spec.cjs tests/stage83-season.spec.cjs tests/v10-upgrade.spec.cjs tests/v4-draw.spec.cjs tests/v10-fallback.spec.cjs tests/v6-mission.spec.cjs tests/v7-current.spec.cjs tests/v10-consistency.spec.cjs tests/v10-trip-card.spec.cjs --workers=1 --timeout=120000 --reporter=list,html --trace=retain-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10-release-report
          path: |
            playwright-report/
            test-results/
