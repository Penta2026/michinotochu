name: Prepare runtime land data
on:
  workflow_dispatch:
  push:
    branches: [land-engine-stage2]
    paths:
      - '.github/workflows/prepare-land-runtime.yml'
      - 'tools/build-land-runtime.py'
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'shapely>=2.0,<3'
      - name: Reuse successful land candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow build-land-candidate.yml --branch land-engine-stage2 --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run"
          gh run download "$run" --name japan-land-candidate --dir candidate
      - name: Generate runtime data
        run: python tools/build-land-runtime.py candidate data/land-runtime --connections data/land-connections-shimanami.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-land-runtime
          path: data/land-runtime/
      - name: Store runtime data on development branch
        if: github.ref == 'refs/heads/land-engine-stage2'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/land-runtime
          git diff --cached --quiet || git commit -m 'Generate verified runtime land tiles'
          git fetch origin land-engine-stage2
          if ! git diff --quiet HEAD origin/land-engine-stage2 -- tools/build-land-runtime.py data/land-connections-shimanami.json .github/workflows/prepare-land-runtime.yml; then
            echo 'Generation inputs changed; refusing stale publication'
            exit 1
          fi
          git rebase origin/land-engine-stage2
          git push origin HEAD:land-engine-stage2
