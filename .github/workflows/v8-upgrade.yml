name: Ver8 consistent release gate
on:
  workflow_dispatch:
  push:
    branches: [consistent-release-v8]
    paths:
      - '.github/workflows/v8-upgrade.yml'
      - 'tests/v8-upgrade.spec.cjs'
      - 'tests/v8-fallback.spec.cjs'
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UPGRADE_WEBROOT: /tmp/michi-upgrade
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Stage v7 and start same-origin server
        run: |
          mkdir -p "$UPGRADE_WEBROOT"
          git archive 3d88854685c557cf84ef8b969922474df9ac3c45 | tar -x -C "$UPGRADE_WEBROOT"
          python3 -m http.server 8766 --bind 127.0.0.1 --directory "$UPGRADE_WEBROOT" >/tmp/michi-upgrade.log 2>&1 &
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/michi-current.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8766/ >/dev/null && curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: npx playwright test tests/stage75-browser.spec.cjs tests/stage81-destination.spec.cjs tests/stage82-ride.spec.cjs tests/stage83-season.spec.cjs tests/v8-upgrade.spec.cjs tests/v4-draw.spec.cjs tests/v8-fallback.spec.cjs tests/v6-mission.spec.cjs tests/v7-current.spec.cjs tests/v8-consistency.spec.cjs --workers=1 --timeout=120000 --reporter=list,html --trace=retain-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v8-release-report
          path: |
            playwright-report/
            test-results/
