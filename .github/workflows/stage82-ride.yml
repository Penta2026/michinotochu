name: Stage 8.2 ride style regression
on:
  push:
    branches: [distance-stage8]
    paths: ['.github/workflows/stage82-ride.yml','tests/stage82-ride.spec.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/michi-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: npx playwright test tests/stage75-browser.spec.cjs tests/stage81-destination.spec.cjs tests/stage82-ride.spec.cjs --workers=1 --timeout=120000 --reporter=list,html --trace=retain-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage82-browser-report
          path: |
            playwright-report/
            test-results/
